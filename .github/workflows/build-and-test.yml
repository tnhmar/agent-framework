name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile main and test code
        run: mvn --batch-mode compile test-compile

      - name: Run bundled TestRunner
        run: |
          java -cp target/classes:target/test-classes com.agentruntime.TestRunner